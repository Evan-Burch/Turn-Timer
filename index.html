<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dune Turn + Phase Timer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #f59e0b;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    .card {
      width: min(98vw, 1200px);
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .game-total {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 180px;
      text-align: right;
    }

    .game-total-label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .game-total-time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      color: #02111b;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:active { transform: scale(0.96); }

    #toggleBtn { background: var(--accent); }
    #resetBtn {
      background: var(--accent-2);
      color: #03140a;
    }
    #nextPhaseBtn {
      background: var(--accent-3);
      color: #1a1200;
    }
    #endGameBtn {
      background: #ef4444;
      color: #2b0000;
    }

    .turns {
      display: grid;
      gap: 10px;
    }

    .turn-panel {
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      overflow: hidden;
    }

    .turn-panel.active-turn {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35) inset;
    }

    .turn-panel > summary {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
    }

    .turn-panel > summary::-webkit-details-marker {
      display: none;
    }

    .turn-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .phase-list {
      padding: 4px 10px 10px;
      display: grid;
      gap: 6px;
    }

    .phase-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      align-items: center;
    }

    .phase-row.current {
      border-color: var(--accent-3);
      background: rgba(245, 158, 11, 0.1);
    }

    .phase-name {
      font-size: 0.9rem;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Dune Turn + Phase Timer</h1>
    <p class="sub">Tracks up to 10 turns, each with 9 phases.</p>

    <div class="top-bar">
      <div class="controls">
        <button id="toggleBtn" type="button">Start</button>
        <button id="nextPhaseBtn" type="button">Next Phase</button>
        <button id="endGameBtn" type="button">End Game</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>

      <div class="game-total">
        <span class="game-total-label">Total Game Time</span>
        <div id="gameTotalTime" class="game-total-time">00:00</div>
      </div>
    </div>

    <section id="turnsContainer" class="turns"></section>

    <p class="hint">Tip: Press “Next Phase” to move through phases. Current turn stays expanded; earlier turns collapse automatically.</p>
  </main>

  <script>
    const PHASES = [
      'Storm',
      'Spice Blow',
      'CHOAM Charity',
      'Bidding',
      'Revival',
      'Shipping and Movement',
      'Battle (Combat)',
      'Spice Collection',
      'Mentat'
    ];
    const MAX_TURNS = 10;

    const turnsContainerEl = document.getElementById('turnsContainer');

    const toggleBtn = document.getElementById('toggleBtn');
    const nextPhaseBtn = document.getElementById('nextPhaseBtn');
    const endGameBtn = document.getElementById('endGameBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gameTotalTimeEl = document.getElementById('gameTotalTime');

    let running = false;
    let startTime = 0;
    let rafId = null;
    let currentTurn = 0;
    let currentPhase = 0;
    let gameEnded = false;
    const expandedTurns = new Set();

    const turns = Array.from({ length: MAX_TURNS }, () => ({
      phases: Array(PHASES.length).fill(0)
    }));

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getTurnTotal(turnIndex) {
      return turns[turnIndex].phases.reduce((sum, ms) => sum + ms, 0);
    }

    function getGameTotalMs() {
      const finishedMs = turns.reduce(
        (sum, turn) => sum + turn.phases.reduce((phaseSum, ms) => phaseSum + ms, 0),
        0
      );

      if (!running) return finishedMs;
      return finishedMs + (performance.now() - startTime);
    }

    function commitLiveTime() {
      if (!running) return;
      const delta = performance.now() - startTime;
      turns[currentTurn].phases[currentPhase] += delta;
      startTime = performance.now();
    }

    function renderTurns() {
      turnsContainerEl.innerHTML = '';

      for (let t = 0; t <= currentTurn; t += 1) {
        const details = document.createElement('details');
        details.className = 'turn-panel';
        if (t === currentTurn || expandedTurns.has(t)) {
          details.open = true;
        }
        if (t === currentTurn) {
          details.classList.add('active-turn');
        }

        const summary = document.createElement('summary');
        summary.addEventListener('click', (event) => {
          if (t === currentTurn) return;
          event.preventDefault();

          if (expandedTurns.has(t)) {
            expandedTurns.delete(t);
          } else {
            expandedTurns.add(t);
          }

          renderStatus();
        });

        const title = document.createElement('span');
        title.className = 'turn-title';
        title.textContent = `Turn ${t + 1}`;

        const total = document.createElement('span');
        total.className = 'time';
        total.setAttribute('data-turn-total', String(t));
        let totalMs = getTurnTotal(t);
        if (running && t === currentTurn) {
          totalMs += performance.now() - startTime;
        }
        total.textContent = formatTime(totalMs);

        summary.appendChild(title);
        summary.appendChild(total);
        details.appendChild(summary);

        const phaseList = document.createElement('div');
        phaseList.className = 'phase-list';

        for (let p = 0; p < PHASES.length; p += 1) {
          const row = document.createElement('div');
          row.className = 'phase-row';

          if (t === currentTurn && p === currentPhase) {
            row.classList.add('current');
          }

          const name = document.createElement('span');
          name.className = 'phase-name';
          name.textContent = PHASES[p];

          const value = document.createElement('span');
          value.className = 'time';
          value.setAttribute('data-phase-time', `${t}-${p}`);
          let ms = turns[t].phases[p];
          if (running && t === currentTurn && p === currentPhase) {
            ms += performance.now() - startTime;
          }
          value.textContent = formatTime(ms);

          row.appendChild(name);
          row.appendChild(value);
          phaseList.appendChild(row);
        }

        details.appendChild(phaseList);
        turnsContainerEl.appendChild(details);
      }
    }

    function renderStatus() {
      renderTurns();
      gameTotalTimeEl.textContent = formatTime(getGameTotalMs());

      const atLastPosition = currentTurn === MAX_TURNS - 1 && currentPhase === PHASES.length - 1;
      nextPhaseBtn.disabled = atLastPosition || gameEnded;
      toggleBtn.disabled = gameEnded;
      endGameBtn.disabled = gameEnded;

      if (gameEnded || atLastPosition) {
        nextPhaseBtn.textContent = 'End Reached';
      } else {
        nextPhaseBtn.textContent = 'Next Phase';
      }
    }

    function updateLiveTimes() {
      if (!running) return;

      const liveDelta = performance.now() - startTime;
      gameTotalTimeEl.textContent = formatTime(getGameTotalMs());

      const totalEl = turnsContainerEl.querySelector(`[data-turn-total="${currentTurn}"]`);
      if (totalEl) {
        totalEl.textContent = formatTime(getTurnTotal(currentTurn) + liveDelta);
      }

      const phaseEl = turnsContainerEl.querySelector(`[data-phase-time="${currentTurn}-${currentPhase}"]`);
      if (phaseEl) {
        phaseEl.textContent = formatTime(turns[currentTurn].phases[currentPhase] + liveDelta);
      }
    }

    function update() {
      updateLiveTimes();
      rafId = requestAnimationFrame(update);
    }

    function endGame() {
      commitLiveTime();
      running = false;
      gameEnded = true;
      toggleBtn.textContent = 'Start';
      cancelAnimationFrame(rafId);
      renderStatus();
    }

    toggleBtn.addEventListener('click', () => {
      if (gameEnded) return;

      if (!running) {
        running = true;
        startTime = performance.now();
        toggleBtn.textContent = 'Pause';
        rafId = requestAnimationFrame(update);
      } else {
        commitLiveTime();
        running = false;
        toggleBtn.textContent = 'Start';
        cancelAnimationFrame(rafId);
        renderStatus();
      }
    });

    endGameBtn.addEventListener('click', () => {
      endGame();
    });

    nextPhaseBtn.addEventListener('click', () => {
      const atLastPosition = currentTurn === MAX_TURNS - 1 && currentPhase === PHASES.length - 1;
      if (atLastPosition) {
        endGame();
        return;
      }

      commitLiveTime();

      if (currentPhase < PHASES.length - 1) {
        currentPhase += 1;
      } else if (currentTurn < MAX_TURNS - 1) {
        currentTurn += 1;
        currentPhase = 0;
        expandedTurns.clear();
      }

      if (running) {
        startTime = performance.now();
      }

      renderStatus();
    });

    resetBtn.addEventListener('click', () => {
      running = false;
      gameEnded = false;
      currentTurn = 0;
      currentPhase = 0;
      expandedTurns.clear();

      for (const turn of turns) {
        turn.phases.fill(0);
      }

      toggleBtn.textContent = 'Start';
      cancelAnimationFrame(rafId);
      renderStatus();
    });

    renderStatus();
  </script>
</body>
</html>
