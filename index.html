<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dune Turn + Phase Timer</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/timer.css" />
</head>
<body>
  <main class="card">
    <h1>Dune Turn + Phase Timer</h1>
    <p class="sub">Tracks up to 10 turns, each with 9 phases.</p>

    <div class="top-bar">
      <div class="controls">
        <button id="toggleBtn" type="button">Start</button>
        <button id="nextPhaseBtn" type="button">Next Phase</button>
        <button id="endGameBtn" type="button">End Game</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>

      <div class="game-total">
        <span class="game-total-label">Total Game Time</span>
        <div id="gameTotalTime" class="game-total-time">00:00</div>
      </div>
    </div>

    <section id="turnsContainer" class="turns"></section>

    <p class="hint">Tip: Press “Next Phase” to move through phases. Current turn stays expanded; earlier turns collapse automatically.</p>

    <section id="reportSection" class="report" hidden>
      <h2>End of Game Report</h2>
      <div class="report-grid">
        <div class="report-card">
          <span class="report-label">Average Turn Time</span>
          <div id="avgTurnTime" class="report-value">00:00</div>
        </div>
        <div class="report-card">
          <span class="report-label">Turns Counted</span>
          <div id="turnsCounted" class="report-value">0</div>
        </div>
      </div>
      <div class="report-card report-phase-card">
        <span class="report-label">Average Time by Phase</span>
        <ul id="phaseAvgList" class="phase-avg-list"></ul>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
